name: 模拟测试与公开发布检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 检查暂存文件与全部历史
        run: python scripts/check_public_tree.py
      - name: 安装中文测试字体
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: 安装锁定依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 运行纯模拟回归
        env:
          STOCKTAKE_CJK_FONT: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
        run: python -m pytest tests -q
